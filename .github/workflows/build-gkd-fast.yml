name: Build GKD Fast APK

# 单文件版：补丁脚本已内嵌，仓库里只需要这一个文件
# 路径必须是 .github/workflows/build-gkd-fast.yml
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode（必须大于手机已安装的版本，官方 1.12.1 是 92）'
        required: true
        default: '93'
      version_name:
        description: 'versionName（显示用）'
        required: true
        default: '1.12.1-fast'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Show environment
        run: |
          uname -a
          java -version || true
          python3 --version || true

      - name: Checkout GKD v1.12.1
        uses: actions/checkout@v6
        with:
          repository: gkd-kit/gkd
          ref: v1.12.1
          path: gkd-src
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Bump version
        run: |
          set -e
          cd gkd-src
          ls -l app/build.gradle.kts
          sed -i "s/versionCode = 92/versionCode = ${{ inputs.version_code }}/" app/build.gradle.kts
          sed -i "s/versionName = \"1.12.1\"/versionName = \"${{ inputs.version_name }}\"/" app/build.gradle.kts
          grep -n 'versionCode\|versionName' app/build.gradle.kts || true

      - name: Apply fast-skip timing patch
